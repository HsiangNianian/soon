[package]
name = "soon"
version = "0.5.0"
edition = "2021"
description = "Local-first prediction for your next full shell command"
license = "MIT"
readme = "README.md"
repository = "https://github.com/HsiangNianian/soon"
homepage = "https://soon.hydroroll.team"
authors = ["HsiangNianian"]
keywords = ["shell", "cli", "prediction", "zsh", "productivity"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "soon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
colored = "3.0.0"
counter = "0.6.0"
dirs = "6.0.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
ureq = "3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
semver = "1"
