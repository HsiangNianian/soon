<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">soon repairs a failed Git command</title>
  <desc id="desc">An 18-second terminal sequence. A mistyped Git command fails, soon suggests git push from local memory, Control-F accepts it into the editable buffer, and the user presses Enter to execute it.</desc>
  <style>
    :root {
      color-scheme: dark;
    }

    text {
      font-family: "SFMono-Regular", "Cascadia Code", "Liberation Mono", monospace;
    }

    .frame {
      fill: #20212a;
      stroke: #0f1016;
      stroke-width: 2;
    }

    .chrome {
      fill: #2b2d38;
    }

    .muted {
      fill: #8d93a4;
    }

    .copy {
      fill: #f5f6fb;
    }

    .prompt {
      fill: #b8f4d2;
    }

    .repair {
      fill: #ff9168;
    }

    .next {
      fill: #8da6ff;
    }

    .ghost {
      fill: #8d93a4;
    }

    .key {
      fill: #f5f6fb;
      font-weight: 700;
    }

    .label {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.09em;
    }

    .terminal {
      font-size: 27px;
    }

    .small {
      font-size: 20px;
    }

    .scene {
      opacity: 0;
      animation-duration: 18s;
      animation-iteration-count: infinite;
    }

    .scene-one {
      animation-name: scene-one;
    }

    .scene-two {
      animation-name: scene-two;
    }

    .scene-three {
      animation-name: scene-three;
    }

    .scene-four {
      animation-name: scene-four;
    }

    .progress {
      transform-origin: 100px 0;
      animation: progress 18s linear infinite;
    }

    .cursor {
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes scene-one {
      0%, 18% { opacity: 1; }
      21%, 100% { opacity: 0; }
    }

    @keyframes scene-two {
      0%, 19% { opacity: 0; }
      22%, 43% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    @keyframes scene-three {
      0%, 44% { opacity: 0; }
      47%, 67% { opacity: 1; }
      70%, 100% { opacity: 0; }
    }

    @keyframes scene-four {
      0%, 68% { opacity: 0; }
      71%, 97% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes progress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene,
      .progress,
      .cursor {
        animation: none;
      }

      .scene {
        opacity: 0;
      }

      .scene-four,
      .cursor {
        opacity: 1;
      }

      .progress {
        transform: scaleX(1);
      }
    }
  </style>

  <rect class="frame" x="1" y="1" width="1198" height="673" rx="22"/>
  <path class="chrome" d="M23 1h1154a22 22 0 0 1 22 22v58H1V23A22 22 0 0 1 23 1z"/>
  <circle cx="36" cy="41" r="9" fill="#ff786c"/>
  <circle cx="66" cy="41" r="9" fill="#f4c45c"/>
  <circle cx="96" cy="41" r="9" fill="#66d38c"/>
  <text x="600" y="49" text-anchor="middle" class="muted small">~/work/soon — zsh</text>
  <rect x="100" y="642" width="1000" height="5" rx="2.5" fill="#353845"/>
  <rect class="progress" x="100" y="642" width="1000" height="5" rx="2.5" fill="#8da6ff"/>

  <g class="scene scene-one">
    <rect x="84" y="111" width="176" height="38" rx="19" fill="#353845"/>
    <text x="172" y="136" text-anchor="middle" class="muted label">COMMAND</text>
    <text x="86" y="207" class="prompt terminal">~/work/soon ›</text>
    <text x="310" y="207" class="copy terminal">git psuh</text>
    <rect class="cursor" x="440" y="181" width="13" height="32" rx="2" fill="#f5f6fb"/>
    <text x="86" y="290" class="muted small">The user presses Enter.</text>
    <text x="86" y="562" class="muted small">soon observes the command lifecycle locally.</text>
  </g>

  <g class="scene scene-two">
    <rect x="84" y="111" width="164" height="38" rx="19" fill="#4a2d28"/>
    <text x="166" y="136" text-anchor="middle" class="repair label">EXIT 1</text>
    <text x="86" y="207" class="prompt terminal">~/work/soon ›</text>
    <text x="310" y="207" class="copy terminal">git psuh</text>
    <text x="86" y="259" class="repair small">git: ‘psuh’ is not a git command.</text>
    <text x="86" y="337" class="prompt terminal">~/work/soon ›</text>
    <text x="310" y="337" class="ghost terminal">git push</text>
    <rect x="852" y="304" width="262" height="45" rx="22.5" fill="#4a2d28"/>
    <text x="983" y="333" text-anchor="middle" class="repair label">REPAIR · 6.8 MS</text>
    <text x="86" y="562" class="muted small">A correction learned from local history appears as editable ghost text.</text>
  </g>

  <g class="scene scene-three">
    <rect x="84" y="111" width="188" height="38" rx="19" fill="#273d33"/>
    <text x="178" y="136" text-anchor="middle" class="prompt label">ACCEPTED</text>
    <text x="86" y="207" class="prompt terminal">~/work/soon ›</text>
    <text x="310" y="207" class="copy terminal">git push</text>
    <rect class="cursor" x="440" y="181" width="13" height="32" rx="2" fill="#f5f6fb"/>
    <rect x="86" y="274" width="138" height="55" rx="12" fill="#3157ff"/>
    <text x="155" y="310" text-anchor="middle" class="key small">Ctrl-F</text>
    <text x="248" y="309" class="copy small">places the suggestion in the buffer.</text>
    <text x="86" y="562" class="muted small">Nothing executes automatically. Edit it, press Enter, or clear it.</text>
  </g>

  <g class="scene scene-four">
    <rect x="84" y="111" width="174" height="38" rx="19" fill="#2c3350"/>
    <text x="171" y="136" text-anchor="middle" class="next label">NEXT-STEP</text>
    <text x="86" y="207" class="prompt terminal">~/work/soon ›</text>
    <text x="310" y="207" class="copy terminal">git push</text>
    <text x="86" y="259" class="muted small">Everything up-to-date</text>
    <text x="86" y="337" class="prompt terminal">~/work/soon ›</text>
    <text x="310" y="337" class="ghost terminal">gh pr checks --watch</text>
    <rect x="820" y="304" width="294" height="45" rx="22.5" fill="#2c3350"/>
    <text x="967" y="333" text-anchor="middle" class="next label">LOCAL · 7.1 MS</text>
    <text x="86" y="466" class="copy small">Failure repaired. Workflow resumed. The next command is ready.</text>
    <text x="86" y="562" class="muted small">18-second loop · default path uses no model and no network</text>
  </g>
</svg>
